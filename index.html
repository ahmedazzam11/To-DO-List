<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember · To-Do List</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <header>
    <div><h1>Ahmed Azzam<span>.</span></h1><div class="sub" id="date"></div></div>
    <button class="sw" id="theme" role="switch" aria-label="Toggle light and dark mode">
      <span class="i s">☀️</span><span class="i m">🌙</span><span class="knob" id="knob">☀️</span>
    </button>
  </header>

  <section class="card hero">
    <div class="ring">
      <svg width="84" height="84" viewBox="0 0 84 84">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a00"/><stop offset="1" stop-color="#ffb366"/></linearGradient></defs>
        <circle cx="42" cy="42" r="35" fill="none" stroke="var(--line)" stroke-width="8"/>
        <circle id="arc" cx="42" cy="42" r="35" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220" style="transition:stroke-dashoffset .6s"/>
      </svg>
      <span id="pct">0%</span>
    </div>
    <div><b id="msg">Start with one small task</b><div class="sub" id="cnt"></div></div>
  </section>

  <div class="card add">
    <input id="in" placeholder="What do you want to get done?" maxlength="120" autocomplete="off">
    <button id="addb">Add</button>
  </div>

  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="active">Active</button>
    <button data-f="done">Done</button>
  </div>

  <ul id="list"></ul>
  <div class="foot"><span id="left"></span><button id="clear">Clear completed</button></div>
</div>
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
